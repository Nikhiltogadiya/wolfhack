<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Fit Happens{% endblock %}</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: { colors: {
  forest: { DEFAULT:'#12402F', 700:'#164C38', 600:'#1C6B4A', 50:'#EAF2ED' },
  cream:  { DEFAULT:'#FAF9F5', 100:'#F3F1EA' },
  hair:   '#E6E3DB',
  ink:    { DEFAULT:'#1B1B19', muted:'#6F6C64' },
}, fontFamily: { sans: ['Inter','ui-sans-serif','system-ui','sans-serif'] } } } }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; }</style>
</head>
<body class="bg-cream text-ink antialiased min-h-screen flex flex-col">
  <header class="border-b border-hair bg-white/70 backdrop-blur">
    <div class="mx-auto max-w-[1000px] px-6 py-3.5 flex items-center gap-6">
      <a href="/" class="flex items-center gap-2.5 shrink-0">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" class="text-forest">
          <path d="M12 3c4 3 7 6 7 10a7 7 0 1 1-14 0c0-4 3-7 7-10z" fill="currentColor" opacity=".9"/>
        </svg>
        <span class="text-[15px] font-semibold">Fit Happens</span>
      </a>
      <nav class="flex items-center gap-5 text-[13.5px]">
        <a href="/jobs" class="hover:text-forest-600 {{ 'font-semibold text-forest-600' if nav == 'jobs' else 'text-ink-muted' }}">Jobs</a>
        <a href="/track" class="hover:text-forest-600 {{ 'font-semibold text-forest-600' if nav == 'track' else 'text-ink-muted' }}">My application</a>
      </nav>
      <a href="/hiring" class="ml-auto text-[13px] text-ink-muted hover:text-forest-600">For employers →</a>
    </div>
  </header>
  <main class="flex-1">{% block body %}{% endblock %}</main>
  <footer class="border-t border-hair py-6">
    <p class="mx-auto max-w-[1000px] px-6 text-[12px] text-ink-muted">
      Applications are read by software and decided by people. Nothing here rejects anyone
      automatically.</p>
  </footer>
</body>
</html>
