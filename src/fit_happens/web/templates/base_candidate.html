<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Fit Happens{% endblock %}</title>
{% include "_head.html" %}
</head>
<body class="bg-cream text-ink antialiased">
<div class="min-h-screen">

  <header class="w-full bg-forest text-white">
    <div class="max-w-[880px] mx-auto px-6 py-4 flex items-center gap-2.5">
      <svg aria-hidden="true" focusable="false" width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path d="M12 3c4 3 7 6 7 10a7 7 0 1 1-14 0c0-4 3-7 7-10z" fill="currentColor" opacity=".9"/>
      </svg>
      <span class="text-[15px] font-semibold">Fit Happens</span>
      <span class="ml-auto text-[12px] text-white/60">Your application</span>
    </div>
  </header>

  <main>
    {% block body %}{% endblock %}
  </main>
</div>
</body>
</html>
