{% extends "base_public.html" %}
{% block title %}Hiring area — Fit Happens{% endblock %}
{% block body %}
<div class="mx-auto max-w-[440px] px-6 py-20">
  <h1 class="text-[24px] font-bold tracking-tight">Hiring area</h1>
  <p class="mt-2 text-[13.5px] leading-relaxed text-ink-muted">
    This side holds applicants' files.</p>

  {% if error %}
  <div class="mt-5 rounded-lg border border-rose-300 bg-rose-50 px-4 py-3 text-[13px] text-rose-900">{{ error }}</div>
  {% endif %}

  <form method="post" action="/hiring/sign-in" class="mt-6 space-y-4">
    <input type="hidden" name="next" value="{{ next }}">
    <input name="passcode" type="password" required autofocus placeholder="Team passcode"
           class="w-full rounded-lg border border-hair px-4 py-3 text-[14px]">
    <button class="w-full rounded-lg bg-forest px-6 py-3 text-[14px] font-semibold text-white hover:bg-forest-700">
      Continue</button>
  </form>

</div>
{% endblock %}
