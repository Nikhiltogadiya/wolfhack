[project]
name = "fit-happens"
version = "0.1.0"
description = "Ranks who fits the role; flags who isn't real. Akkodis talent-marketplace hackathon build."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Private :: Do Not Upload",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langgraph>=0.2.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "pypdfium2>=4.30",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "reportlab>=4.2",
    "pillow>=10.4",
    "rapidfuzz>=3.10",
    "pyyaml>=6.0",
    "python-dotenv>=1.2.3",
]

[project.optional-dependencies]
detect = ["transformers>=4.44", "torch>=2.4", "sentencepiece>=0.2"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fit_happens"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: hits real network APIs (NIM, GitHub) - deselected by default"]
addopts = "-m 'not live' -q"
